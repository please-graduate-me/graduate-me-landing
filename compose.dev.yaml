services:
  landing:
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - out/
            - .git/
            - .env
            - .env.*
            - '*.tsbuildinfo'
            - package.json
            - pnpm-lock.yaml
            - Dockerfile*
            - compose*.yaml
            - next.config.ts
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile.dev
        - action: rebuild
          path: ./next.config.ts
