name: graduate-me-landing
services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm dev:app
    environment:
      NEXT_PUBLIC_APP_URL: '${NEXT_PUBLIC_APP_URL:-https://app.pleasegraduate.me}'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - 127.0.0.1:3002:3002
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
